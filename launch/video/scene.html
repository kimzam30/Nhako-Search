<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>NhakoSearch launch</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Nunito:wght@700;800;900&family=Caveat:wght@600&display=block" rel="stylesheet">
<style>
  /* The app's own tokens (app/globals.css), light and dark. */
  :root {
    --ink: #4A1942; --ink-2: #7A4A70; --line: #4A1942; --bg: #FFF6F8; --surface: #FFE3ED; --tile: #FFFDFE;
    --accent: #FF6FA5; --on-accent: #2A0F26; --gold: #FFD166; --lav: #C3A6F0; --mint: #8EDDB0; --lawn: #8fcf9e;
    --w1: #FF9AC4; --w2: #C3A6F0; --w3: #8EDDB0; --w4: #FFD27A; --w5: #9FD3F7; --w6: #FFB08A;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: 1080px; height: 1920px; overflow: hidden; }
  body { position: relative; background: var(--bg); color: var(--ink); font-family: Nunito, sans-serif; }
  .layer { position: absolute; inset: 0; }
  #bg { background: var(--bg); }
  #grid { background-image: linear-gradient(rgb(74 25 66 / .055) 2px, transparent 2px), linear-gradient(90deg, rgb(74 25 66 / .055) 2px, transparent 2px); background-size: 60px 60px; }
  #lawn { background: var(--lawn); opacity: 0; }
  #lawn i { position: absolute; width: 12px; height: 12px; }
  #night { background: radial-gradient(120% 80% at 50% 10%, #2A1F58, #140E2C 70%); opacity: 0; }
  #night i { position: absolute; width: 6px; height: 6px; border-radius: 50%; background: #FFE9A8; }

  .fly { position: absolute; width: 70px; height: 58px; will-change: transform; }

  /* ---- kinetic type ---- */
  .big { position: absolute; left: 0; right: 0; text-align: center; font-family: Fredoka, sans-serif; font-weight: 700; color: var(--ink); letter-spacing: -2px; }
  #intro1 { top: 700px; font-size: 150px; }
  #intro2 { top: 880px; font-size: 150px; }
  #intro2 .two { position: relative; display: inline-block; padding: 0 24px; }
  #intro2 .two svg { position: absolute; left: -10px; top: -6px; width: calc(100% + 20px); height: calc(100% + 12px); overflow: visible; z-index: -1; }
  #introLogo { position: absolute; left: 50%; top: 360px; width: 220px; height: 220px; margin-left: -110px; image-rendering: pixelated; filter: drop-shadow(8px 10px 0 var(--line)); }
  #bridge1 { top: 720px; font-size: 128px; }
  #bridge2 { top: 880px; font-size: 168px; color: var(--accent); -webkit-text-stroke: 6px var(--line); paint-order: stroke fill; }

  /* ---- captions ---- */
  #caption { position: absolute; left: 60px; right: 60px; top: 215px; text-align: center; display: flex; flex-direction: column; align-items: center; gap: 22px; }
  #eyebrow { display: inline-block; padding: 10px 28px; border: 4px solid var(--line); border-radius: 999px; background: var(--gold); font-weight: 900; font-size: 34px; letter-spacing: 1px; box-shadow: 5px 6px 0 var(--line); }
  #head { font-family: Fredoka, sans-serif; font-weight: 700; font-size: 80px; line-height: 1.02; letter-spacing: -1.5px; }
  #sub { font-weight: 800; font-size: 38px; line-height: 1.25; color: var(--ink-2); max-width: 900px; }
  body.dark #head { color: #FFF3FA; }
  body.dark #sub { color: #D9C7EE; }

  /* ---- devices ---- */
  .phone { position: absolute; border: 16px solid var(--line); border-radius: 76px; background: var(--line); overflow: hidden; box-shadow: 14px 18px 0 rgb(74 25 66 / .28); }
  .phone .screen { position: absolute; inset: 0; border-radius: 60px; overflow: hidden; background: #fff; }
  .phone img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; object-position: top; }
  .phone .notch { position: absolute; left: 50%; top: 14px; width: 150px; height: 40px; margin-left: -75px; border-radius: 22px; background: var(--line); z-index: 3; }
  #phone { left: 270px; top: 650px; width: 540px; height: 1170px; }
  #duoA { left: 64px; top: 730px; width: 460px; height: 996px; }
  #duoB { left: 556px; top: 730px; width: 460px; height: 996px; }
  .tag { position: absolute; top: -78px; left: 50%; transform: translateX(-50%); padding: 8px 26px; border: 4px solid var(--line); border-radius: 999px; font-weight: 900; font-size: 32px; background: #fff; box-shadow: 4px 5px 0 var(--line); white-space: nowrap; }
  .duo { overflow: visible !important; }
  #vs { position: absolute; left: 540px; top: 1210px; width: 180px; height: 180px; margin: -90px 0 0 -90px; border-radius: 50%; border: 6px solid var(--line); background: var(--accent); display: flex; align-items: center; justify-content: center; font-family: Fredoka, sans-serif; font-weight: 700; font-size: 84px; color: #fff; -webkit-text-stroke: 3px var(--line); paint-order: stroke fill; box-shadow: 7px 9px 0 var(--line); z-index: 5; }

  /* ---- install ---- */
  #steps { position: absolute; left: 80px; right: 80px; top: 630px; display: flex; flex-direction: column; gap: 18px; align-items: center; }
  .step { display: flex; align-items: center; gap: 20px; padding: 14px 30px 14px 16px; border: 4px solid var(--line); border-radius: 999px; background: #fff; box-shadow: 5px 6px 0 var(--line); font-weight: 900; font-size: 38px; }
  .step b { width: 58px; height: 58px; border-radius: 50%; border: 4px solid var(--line); background: var(--accent); color: var(--on-accent); display: flex; align-items: center; justify-content: center; font-family: Fredoka, sans-serif; font-size: 34px; }
  #home { left: 290px; top: 990px; width: 500px; height: 1082px; }
  #home .screen { background: linear-gradient(170deg, #C9B8F2, #FFC7DE 60%, #FFE3C2); }
  #apps { position: absolute; left: 34px; right: 34px; top: 110px; display: grid; grid-template-columns: repeat(4, 1fr); gap: 34px 24px; }
  #apps span { aspect-ratio: 1; border-radius: 22px; }
  #apps span.slot { background: none; }
  #dropIcon { position: absolute; width: 96px; height: 96px; border-radius: 22px; image-rendering: pixelated; z-index: 4; }
  #dropLabel { position: absolute; width: 140px; text-align: center; font-weight: 900; font-size: 18px; color: #fff; text-shadow: 0 2px 3px rgb(0 0 0 / .4); z-index: 4; }
  #tap { position: absolute; width: 110px; height: 110px; margin: -55px 0 0 -55px; border-radius: 50%; border: 6px solid #fff; background: rgb(255 255 255 / .35); z-index: 6; }

  /* ---- every device ---- */
  #laptop { position: absolute; left: 70px; top: 760px; width: 940px; }
  #laptop .lid { position: relative; height: 610px; border: 18px solid var(--line); border-radius: 30px 30px 8px 8px; background: #fff; overflow: hidden; }
  #laptop .lid img { width: 100%; height: 100%; object-fit: cover; object-position: top; }
  #laptop .base { height: 34px; margin: 0 -50px; background: var(--line); border-radius: 0 0 40px 40px; }
  #tablet { left: 40px; top: 1180px; width: 420px; height: 600px; border-width: 14px; border-radius: 40px; }
  #tablet .screen { border-radius: 28px; }
  #phone2 { left: 690px; top: 1220px; width: 290px; height: 628px; border-width: 12px; border-radius: 48px; }
  #phone2 .screen { border-radius: 38px; }
  #phone2 .notch { width: 80px; height: 22px; margin-left: -40px; top: 8px; }

  /* ---- end card ---- */
  #end { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 40px; }
  #endIcon { width: 360px; height: 360px; image-rendering: pixelated; filter: drop-shadow(12px 14px 0 var(--line)); }
  #endTitle { font-family: Fredoka, sans-serif; font-weight: 700; font-size: 150px; letter-spacing: -3px; line-height: .9; }
  #endTag { font-weight: 900; font-size: 56px; }
  #endTag em { font-style: normal; padding: 0 22px; border: 5px solid var(--line); border-radius: 999px; background: var(--w1); box-shadow: 5px 6px 0 var(--line); }
  #endUrl { padding: 18px 44px; border: 5px solid var(--line); border-radius: 999px; background: #fff; font-weight: 900; font-size: 52px; box-shadow: 7px 8px 0 var(--line); }
  #endSmall { font-weight: 800; font-size: 36px; color: var(--ink); opacity: .8; }
</style>
</head>
<body>
  <div id="bg" class="layer"></div>
  <div id="grid" class="layer"></div>
  <div id="lawn" class="layer"></div>
  <div id="night" class="layer"></div>
  <div id="flies" class="layer"></div>

  <img id="introLogo" src="/public/icons/icon-512.png" alt="">
  <div id="intro1" class="big">Word search.</div>
  <div id="intro2" class="big">Made for <span class="two">two.<svg viewBox="0 0 100 100" preserveAspectRatio="none"><rect id="introCap" x="2" y="8" width="96" height="84" rx="42" ry="42" pathLength="1" fill="none" stroke="var(--line)" stroke-width="6" vector-effect="non-scaling-stroke"/></svg></span></div>
  <div id="bridge1" class="big">Now bring</div>
  <div id="bridge2" class="big">a friend.</div>

  <div id="caption"><span id="eyebrow"></span><div id="head"></div><div id="sub"></div></div>

  <div id="phone" class="phone"><div class="screen"><img id="phA" alt=""><img id="phB" alt=""></div><div class="notch"></div></div>

  <div id="duoA" class="phone duo"><div class="screen"><img alt=""></div><div class="notch"></div><span class="tag">You</span></div>
  <div id="duoB" class="phone duo"><div class="screen"><img alt=""></div><div class="notch"></div><span class="tag" style="background:var(--w2)">Your friend</span></div>
  <div id="vs">VS</div>

  <div id="steps">
    <div class="step"><b>1</b>Open search.nhako.com</div>
    <div class="step"><b>2</b>Tap Share or Install</div>
    <div class="step"><b>3</b>Add to Home Screen</div>
  </div>
  <div id="home" class="phone"><div class="screen"><div id="apps"></div><img id="dropIcon" src="/public/icons/icon-512.png" alt=""><div id="dropLabel">NhakoSearch</div><div id="tap"></div></div><div class="notch"></div></div>

  <div id="laptop"><div class="lid"><img src="/launch/video/shots/laptop.png" alt=""></div><div class="base"></div></div>
  <div id="tablet" class="phone"><div class="screen"><img src="/launch/video/shots/tablet.png" alt=""></div></div>
  <div id="phone2" class="phone"><div class="screen"><img src="/launch/video/shots/race-guest.png" alt=""></div><div class="notch"></div></div>

  <div id="end">
    <img id="endIcon" src="/public/icons/icon-512.png" alt="">
    <div id="endTitle">NhakoSearch</div>
    <div id="endTag">Cozy word search <em>for two</em></div>
    <div id="endUrl">search.nhako.com</div>
    <div id="endSmall">Free. Plays in your browser. Installs anywhere.</div>
  </div>

<script type="module" src="./scene.js"></script>
</body>
</html>
